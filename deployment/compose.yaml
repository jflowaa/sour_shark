name: sour-shark

services:
  sour-shark:
    image: sour_shark:${IMAGE_TAG}
    container_name: sour-shark
    restart: unless-stopped
    networks: [edge]
    mem_limit: 64m
    security_opt: [no-new-privileges:true]
    logging:
      driver: k8s-file
      options:
        max-size: "15m"

networks:
  edge:
    external: true
